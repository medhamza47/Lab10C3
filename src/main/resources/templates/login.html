<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Connexion - Application Sécurisée</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; text-align: center; margin-top: 100px; }
        .login-box {
            background: white; padding: 25px; border-radius: 8px;
            width: 340px; margin: auto; box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        input { width: 90%; padding: 8px; margin: 6px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { padding: 10px 20px; border: none; border-radius: 5px; background: #2b5797; color: white; cursor: pointer; width: 90%; font-size: 15px; margin-top: 10px; }
        button:hover { background: #1e3f6f; }
        p.error { color: red; margin-top: 12px; font-size: 14px; }
        p.logout { color: green; margin-top: 12px; font-size: 14px; }
        .hint { font-size: 12px; color: #666; margin-top: 15px; text-align: left; background: #f9f9f9; padding: 10px; border-radius: 4px; }
        .hint code { background: #eee; padding: 2px 4px; border-radius: 3px; }
    </style>
</head>
<body>
<div class="login-box">
    <h2>Authentification</h2>
    <form th:action="@{/authenticate}" method="post">
        <div style="text-align: left; margin: 0 5%;">
            <label>Nom d’utilisateur :</label>
        </div>
        <input type="text" name="username" placeholder="Saisir le nom d’utilisateur" required autofocus>

        <div style="text-align: left; margin: 6px 5% 0 5%;">
            <label>Mot de passe :</label>
        </div>
        <input type="password" name="password" placeholder="Mot de passe" required>

        <button type="submit">Se connecter</button>
    </form>

    <p th:if="${param.error}" class="error">Identifiants incorrects, veuillez réessayer.</p>
    <p th:if="${param.logout}" class="logout">Vous êtes déconnecté avec succès.</p>

    <div class="hint">
        <strong>Identifiants de test :</strong>
        <ul style="margin: 5px 0 0 15px; padding: 0;">
            <li><code>user</code> / <code>1111</code> (Rôle: USER)</li>
            <li><code>admin</code> / <code>1234</code> (Rôle: ADMIN)</li>
        </ul>
    </div>
</div>
</body>
</html>
